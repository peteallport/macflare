name: Public repository quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-content:
    name: Public content and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test safe tool installation
        run: python3 -B script/test-quality-tools.py
      - name: Install pinned validators
        run: |
          python3 script/install-quality-tools.py "$RUNNER_TEMP/macflare-quality-tools" gitleaks actionlint zizmor
          echo "$RUNNER_TEMP/macflare-quality-tools" >> "$GITHUB_PATH"
      - name: Scan indexed content and reachable history
        run: python3 script/check-public-content.py --history
      - name: Validate workflows
        run: |
          actionlint -color
          zizmor --offline --no-progress .github/workflows
