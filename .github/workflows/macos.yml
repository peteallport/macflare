name: macOS

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Debug tests and Release build
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # Keep the compiler explicit when the hosted image's default changes.
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      RESOLVED_FILE: macflare.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain and tracked dependency resolution
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if [[ "$xcode_version" != $'Xcode 27.0\nBuild version 27A266a' ]]; then
            echo '::error::CI requires release Xcode 27.0 (27A266a). Update the toolchain pin deliberately.'
            exit 1
          fi
          xcrun swift --version
          test -f "$RESOLVED_FILE"
          git ls-files --error-unmatch "$RESOLVED_FILE"
          mkdir -p "$RUNNER_TEMP/macflare-results"

      - name: Install pinned Swift validation tools
        env:
          SWIFTFORMAT_VERSION: '0.61.1'
          SWIFTFORMAT_SHA256: b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584
          SWIFTLINT_VERSION: '0.63.2'
          SWIFTLINT_SHA256: c59a405c85f95b92ced677a500804e081596a4cae4a6a485af76065557d6ed29
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/macflare-validation-tools"
          mkdir -p "$tool_dir/swiftformat" "$tool_dir/swiftlint"
          curl -fsSL --retry 3 \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" \
            -o "$tool_dir/swiftformat.zip"
          curl -fsSL --retry 3 \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            -o "$tool_dir/swiftlint.zip"
          echo "$SWIFTFORMAT_SHA256  $tool_dir/swiftformat.zip" | shasum -a 256 --check
          echo "$SWIFTLINT_SHA256  $tool_dir/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$tool_dir/swiftformat.zip" -d "$tool_dir/swiftformat"
          unzip -q "$tool_dir/swiftlint.zip" -d "$tool_dir/swiftlint"
          test "$("$tool_dir/swiftformat/swiftformat" --version)" = "$SWIFTFORMAT_VERSION"
          test "$("$tool_dir/swiftlint/swiftlint" version)" = "$SWIFTLINT_VERSION"
          echo "$tool_dir/swiftformat" >> "$GITHUB_PATH"
          echo "$tool_dir/swiftlint" >> "$GITHUB_PATH"

      - name: Test staged validation
        run: python3 -B -u script/test-pre-commit.py

      - name: Check Swift formatting and lint
        run: |
          set -euo pipefail
          test -f .swiftformat
          test ! -L .swiftformat
          test -f .swiftlint.yml
          test ! -L .swiftlint.yml
          git ls-files -z -- ':(glob)**/.swiftlint.yml' > "$RUNNER_TEMP/macflare-swiftlint-configs"
          while IFS= read -r -d '' config; do
            if [[ -L "$config" || ! -f "$config" ]]; then
              printf 'SwiftLint configuration must be a regular file: %s\n' "$config" >&2
              exit 1
            fi
            swiftlint rules --config "$config" > /dev/null
          done < "$RUNNER_TEMP/macflare-swiftlint-configs"
          swiftformat macflare macflareTests macflareUITests --lint --cache ignore
          swiftlint lint --quiet --no-cache

      - name: Build and test Debug
        run: |
          set -euo pipefail
          xcodebuild test \
            -project macflare.xcodeproj \
            -scheme macflare \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/macflare-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/macflare-results/Debug.xcresult" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/macflare-results/Debug.log"

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild build \
            -project macflare.xcodeproj \
            -scheme macflare \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/macflare-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/macflare-results/Release.xcresult" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/macflare-results/Release.log"

      - name: Verify dependency resolution did not change
        if: always()
        run: |
          set -euo pipefail
          test -f "$RESOLVED_FILE"
          git diff --exit-code -- "$RESOLVED_FILE"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macflare-results/
          if-no-files-found: ignore
          retention-days: 7
