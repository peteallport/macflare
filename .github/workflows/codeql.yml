name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: CodeQL Swift
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Swift analysis
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build for analysis
        run: |
          xcodebuild build -project macflare.xcodeproj -scheme macflare \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/codeql-derived-data" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO
      - name: Analyze Swift
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:swift
